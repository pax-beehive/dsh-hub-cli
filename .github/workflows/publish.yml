name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: RELEASE_TAG="${GITHUB_REF_NAME}" pnpm release:check
      - run: pnpm check
      - name: Pack release artifacts
        run: |
          mkdir -p "${RUNNER_TEMP}/dsh-hub-packages"
          pnpm --filter @dsh-plugin-hub/schemas pack --pack-destination "${RUNNER_TEMP}/dsh-hub-packages"
          pnpm --filter @dsh-plugin-hub/registry pack --pack-destination "${RUNNER_TEMP}/dsh-hub-packages"
          pnpm --filter @dsh-plugin-hub/cli pack --pack-destination "${RUNNER_TEMP}/dsh-hub-packages"
          pnpm --filter @dsh-plugin-hub/dsh-plugin pack --pack-destination "${RUNNER_TEMP}/dsh-hub-packages"
      - name: Publish with npm OIDC
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "${RUNNER_TEMP}/dsh-hub-packages/dsh-plugin-hub-schemas-${version}.tgz" --access public --provenance
          npm publish "${RUNNER_TEMP}/dsh-hub-packages/dsh-plugin-hub-registry-${version}.tgz" --access public --provenance
          npm publish "${RUNNER_TEMP}/dsh-hub-packages/dsh-plugin-hub-cli-${version}.tgz" --access public --provenance
          npm publish "${RUNNER_TEMP}/dsh-hub-packages/dsh-plugin-hub-dsh-plugin-${version}.tgz" --access public --provenance
