name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: RELEASE_TAG="${GITHUB_REF_NAME}" pnpm release:check
      - run: pnpm check
      - run: pnpm --filter @dsh-plugin-hub/schemas publish --access public --provenance --no-git-checks
      - run: pnpm --filter @dsh-plugin-hub/registry publish --access public --provenance --no-git-checks
      - run: pnpm --filter @dsh-plugin-hub/cli publish --access public --provenance --no-git-checks
      - run: pnpm --filter @dsh-plugin-hub/dsh-plugin publish --access public --provenance --no-git-checks
